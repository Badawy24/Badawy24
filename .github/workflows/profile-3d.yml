name: GitHub-Profile-3D-Contrib

on:
  # runs once a day
  schedule:
    - cron: "0 0 * * *"
  # allow manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # commits the generated svg files directly to the main branch
      # they land in ./profile-3d-contrib/*.svg, which the README links to
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .

          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi

          git commit -m "chore: update 3d contribution calendar"

          # Retry logic: reset to origin/main and apply our changes
          for i in 1 2 3; do
            echo "Push attempt $i..."
            
            # Fetch latest changes from origin
            if ! git fetch origin main; then
              echo "Fetch failed, retrying..."
              sleep $((i * 10))
              continue
            fi
            
            # Reset to origin/main and reapply our commits
            if ! git reset --soft origin/main; then
              echo "Reset failed, retrying..."
              sleep $((i * 10))
              continue
            fi
            
            # Commit our changes again (if anything staged)
            if ! git diff --cached --quiet; then
              git commit -m "chore: update 3d contribution calendar"
            fi
            
            # Try to push
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            else
              echo "Push attempt $i failed, retrying in $((i * 10)) seconds..."
              sleep $((i * 10))
            fi
          done
          
          echo "All push attempts failed after 3 retries"
          exit 1
