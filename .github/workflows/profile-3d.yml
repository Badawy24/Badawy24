name: GitHub-Profile-3D-Contrib

on:
  # runs once a day
  schedule:
    - cron: "0 0 * * *"
  # allow manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # commits the generated svg files directly to the main branch
      # they land in ./profile-3d-contrib/*.svg, which the README links to
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .

          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi

          git commit -m "chore: update 3d contribution calendar"

          # Retry logic with exponential backoff
          # Fetch latest changes and rebase before pushing
          for i in 1 2 3; do
            echo "Push attempt $i..."
            if git fetch origin main && git rebase origin/main && git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Push attempt $i failed, retrying in $((i * 10)) seconds..."
              sleep $((i * 10))
            else
              echo "All push attempts failed after 3 retries"
              exit 1
            fi
          done
