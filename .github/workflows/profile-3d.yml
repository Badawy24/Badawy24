name: GitHub-Profile-3D-Contrib

on:
  # runs once a day
  schedule:
    - cron: "0 0 * * *"
  # allow manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # commits the generated svg files directly to the main branch
      # they land in ./profile-3d-contrib/*.svg, which the README links to
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main
          git reset --hard origin/main
          git add -A .

          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi

          git commit -m "chore: update 3d contribution calendar"
          git push origin main
